<!doctype html>
<html lang="fa" dir="rtl" data-t="dark" data-accent="azure" data-lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CandyTunnel</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070707">
<style>
/* ── Design tokens ────────────────────────────────────────────────────────
   Monochrome by default; colour means status (ok / warn / error). One accent,
   spent only on the mark, the primary button, the active nav item and focus. */
:root{
  --radius:16px; --radius-lg:22px;
  --ok:#22c55e; --wr:#f59e0b; --er:#ef4444;
  --spring:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Vazirmatn,"Noto Sans Arabic",Inter,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-t="dark"]{
  --bg:#070707; --s1:#121214; --s2:#1a1a1d; --s3:#222227;
  --ln:rgba(255,255,255,.08); --ln2:rgba(255,255,255,.15); --ln3:rgba(255,255,255,.3);
  --tx:#fafafa; --tx2:#dcdcdc; --mu:#8e8e8e; --dim:#606060; --faint:#3d3d3d;
  --sunk:rgba(255,255,255,.05); --field:#0c0c0e;
  --glass:color-mix(in srgb,var(--s1) 82%,transparent);
  --glass-solid:color-mix(in srgb,var(--s1) 94%,transparent);
  --lift:0 2px 10px rgba(0,0,0,.4),0 18px 44px -20px rgba(0,0,0,.85);
}
:root[data-t="light"]{
  --bg:#eef1f6; --s1:#ffffff; --s2:#f7f9fc; --s3:#eef1f6;
  --ln:rgba(10,20,40,.09); --ln2:rgba(10,20,40,.17); --ln3:rgba(10,20,40,.34);
  --tx:#0b0f17; --tx2:#2c313c; --mu:#6a7180; --dim:#99a0ad; --faint:#c7ccd6;
  --sunk:rgba(10,20,40,.045); --field:#ffffff;
  --glass:color-mix(in srgb,var(--s1) 86%,transparent);
  --glass-solid:color-mix(in srgb,var(--s1) 96%,transparent);
  --lift:0 2px 10px rgba(30,40,70,.06),0 18px 44px -22px rgba(30,40,70,.28);
}
:root[data-accent="azure"]{ --ac:#38bdf8; --ac-on:#04222e; }
:root[data-accent="azure"][data-t="light"]{ --ac:#0e85b8; --ac-on:#fff; }
:root[data-accent="violet"]{ --ac:#8b7cf6; --ac-on:#fff; }
:root[data-accent="lime"]{ --ac:#8bd450; --ac-on:#0f1b06; }
:root[data-accent="lime"][data-t="light"]{ --ac:#5f8a00; --ac-on:#fff; }
:root[data-accent="ember"]{ --ac:#f6702d; --ac-on:#fff; }
:root[data-accent]{ --ac-soft:color-mix(in srgb,var(--ac) 15%,transparent); }

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--bg);color:var(--tx);font-family:var(--font);
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
a{color:var(--ac);text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── Horizon background ── */
.bgbars{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;display:flex}
.bgbars i{flex:1 0 0;height:100%;transform-origin:bottom;transform:scaleY(var(--s));
  background:linear-gradient(to top,color-mix(in srgb,var(--ac) 20%,transparent),
    color-mix(in srgb,var(--ac) 5%,transparent) 45%,transparent 78%);
  animation:pulse 2.6s ease-in-out var(--d) infinite alternate}
:root[data-t="light"] .bgbars i{background:linear-gradient(to top,
  color-mix(in srgb,var(--ac) 13%,transparent),color-mix(in srgb,var(--ac) 3%,transparent) 45%,transparent 78%)}
@keyframes pulse{to{transform:scaleY(calc(var(--s)*.72))}}

/* ── Boot ── */
#boot{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:var(--bg);transition:opacity .5s ease,visibility .5s ease}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
.boot-mark{width:60px;height:60px;position:relative;display:grid;place-items:center}
.boot-mark .ring{position:absolute;inset:0;transform:rotate(-90deg)}
.boot-mark .trk{stroke:var(--ln2);stroke-width:2;fill:none}
.boot-mark .arc{stroke:var(--ac);stroke-width:2.4;stroke-linecap:round;fill:none;
  stroke-dasharray:182;stroke-dashoffset:182;animation:fill 1.1s var(--spring) infinite}
@keyframes fill{0%{stroke-dashoffset:182}60%,100%{stroke-dashoffset:20}}
.boot-logo{width:42px;height:42px;border-radius:13px;background:var(--ac);color:var(--ac-on);display:grid;place-items:center}
.boot-logo svg{width:22px;height:22px;stroke-width:2.2}
.boot-title{font-size:19px;font-weight:680;letter-spacing:-.02em}

/* ── App shell ── */
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 clamp(12px,3vw,24px) 60px}
header.hd{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 2px 12px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hd .mk{width:36px;height:36px;border-radius:11px;background:var(--ac);color:var(--ac-on);display:grid;place-items:center;flex:none}
.hd .mk svg{width:19px;height:19px;stroke-width:2.1}
.hd .who{min-width:0}
.hd .who b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hd .who small{display:block;font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .sp{flex:1}
.ic{width:36px;height:36px;border-radius:11px;border:1px solid var(--ln);background:var(--s1);color:var(--mu);
  cursor:pointer;display:grid;place-items:center;flex:none;transition:.18s;font-size:12px;font-weight:700}
.ic:hover{background:var(--sunk);color:var(--tx);border-color:var(--ln2)}
.ic svg{width:17px;height:17px}

/* ── Dock ── */
.dockZ{display:flex;justify-content:center;padding:14px 0 18px}
.dock{display:inline-flex;gap:3px;padding:4px;border-radius:14px;border:1px solid var(--ln);background:var(--s2)}
.dock button{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:-.01em;
  padding:9px 15px;border-radius:11px;border:0;background:transparent;color:var(--mu);cursor:pointer;transition:.18s;white-space:nowrap}
.dock button:hover{color:var(--tx2)}
.dock button.on{background:var(--ac);color:var(--ac-on)}
.dock button svg{width:16px;height:16px;flex:none}
.dock .n{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:7px;background:var(--sunk);color:var(--mu)}
.dock button.on .n{background:color-mix(in srgb,var(--ac-on) 20%,transparent);color:var(--ac-on)}
.dock .n:empty{display:none}
@media (max-width:640px){
  .dock{display:flex;width:100%} .dock button{flex:1;justify-content:center;padding:9px 6px}
  .dock button:not(.on) span:not(.n){display:none}
}

/* ── Cards ── */
.card{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--ln);border-top-color:color-mix(in srgb,var(--tx) 12%,transparent);
  border-radius:var(--radius-lg);box-shadow:var(--lift);padding:18px 20px;margin-bottom:16px}
.card h2{font-size:16px;font-weight:680;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;margin-bottom:3px}
.card h2 svg{width:17px;height:17px;color:var(--mu)}
.card .sub{color:var(--mu);font-size:12.5px;margin-bottom:15px;line-height:1.5}
.sectitle{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
.sectitle h3{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.sectitle .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--ac-soft),var(--ln) 40%)}

/* ── Resource tiles ── */
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:var(--radius);overflow:hidden}
.res .t{background:var(--glass-solid);padding:15px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.res .t .k{font-size:11px;color:var(--dim);font-weight:560}
.res .t .v{font-size:23px;font-weight:700;line-height:1}
.res .t .v em{font-style:normal;font-size:12px;color:var(--mu);font-weight:560;margin-inline-start:3px}
.res .t .bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.res .t .bar i{display:block;height:100%;border-radius:3px;background:var(--ac);width:0;transition:width .7s var(--spring)}
.res .t .s{font-size:11px;color:var(--dim)}
@media (max-width:760px){.res{grid-template-columns:repeat(2,1fr)}}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln);border-radius:11px;padding:9px 15px;
  font-size:13px;font-weight:620;cursor:pointer;background:var(--s1);color:var(--tx);transition:.16s;white-space:nowrap}
.btn:hover{background:var(--sunk);border-color:var(--ln2)}
.btn.primary{background:var(--ac);color:var(--ac-on);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.danger{color:var(--er);border-color:color-mix(in srgb,var(--er) 32%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--er) 12%,transparent)}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}

/* ── Forms ── */
.field{display:block;margin-bottom:13px}
.field .lab{display:block;font-size:12px;color:var(--mu);font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--ln);color:var(--tx);
  border-radius:11px;padding:10px 12px;font-size:14px;transition:.16s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
textarea{resize:vertical;min-height:110px;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.hint{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0;font-size:13px}
.sw input{display:none}
.track{width:40px;height:23px;border-radius:14px;background:var(--ln2);position:relative;transition:.2s;flex:none}
.track::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked + .track{background:var(--ac)}
.sw input:checked + .track::after{inset-inline-start:20px}

/* ── Instance rows ── */
.inst{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid var(--ln);border-radius:var(--radius);
  background:var(--glass-solid);margin-bottom:10px;transition:.16s}
.inst:hover{border-color:var(--ln2)}
.inst .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
.inst .dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.inst .dot.bad{background:var(--er)}
.inst .id{flex:1;min-width:0}
.inst .id b{display:block;font-size:14.5px;font-weight:660;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inst .id .meta{display:flex;gap:7px;margin-top:3px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:680;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:7px;background:var(--sunk);color:var(--mu)}
.chip.role{background:var(--ac-soft);color:var(--ac)}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.chip.bad{color:var(--er);background:color-mix(in srgb,var(--er) 13%,transparent)}
.inst .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.iic{width:32px;height:32px;border-radius:9px;border:1px solid var(--ln);background:var(--s1);color:var(--mu);
  cursor:pointer;display:grid;place-items:center;transition:.16s}
.iic:hover{background:var(--sunk);color:var(--tx)}
.iic.go:hover{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.iic.stop:hover{color:var(--er);border-color:color-mix(in srgb,var(--er) 35%,transparent)}
.iic svg{width:15px;height:15px}
.empty{text-align:center;color:var(--mu);padding:38px 16px;border:1px dashed var(--ln2);border-radius:var(--radius);font-size:13px}
.empty b{display:block;color:var(--tx2);font-size:14.5px;margin-bottom:6px}

/* ── Dialog ── */
.scrim{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.scrim.on{display:flex}
.scrim .veil{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 60%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.dlg{position:relative;width:min(600px,100%);max-height:88vh;display:flex;flex-direction:column;
  background:var(--s1);border:1px solid var(--ln2);border-radius:var(--radius-lg);box-shadow:var(--lift);overflow:hidden}
.dlg .dh{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--ln)}
.dlg .dh b{flex:1;font-size:16px;font-weight:680;letter-spacing:-.02em}
.dlg .dh .x{width:32px;height:32px;border-radius:9px;border:1px solid var(--ln);background:transparent;color:var(--mu);cursor:pointer}
.dlg .dh .x:hover{background:var(--sunk);color:var(--tx)}
.dlg .db{padding:18px;overflow:auto}
.dlg .df{display:flex;gap:9px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--ln);flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;color:var(--mu);font-weight:620;font-size:13px;cursor:pointer;transition:.16s}
.tabs button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
details.grp{border:1px solid var(--ln);border-radius:12px;margin-bottom:11px;overflow:hidden}
details.grp>summary{cursor:pointer;padding:12px 15px;font-weight:650;font-size:13px;background:var(--sunk);list-style:none;display:flex;align-items:center;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"▾";margin-inline-start:auto;color:var(--mu);transition:.2s}
details.grp[open]>summary::after{transform:rotate(180deg)}
details.grp .gb{padding:15px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
details.grp .gb .full{grid-column:1/-1}

/* ── Code box ── */
.codebox{background:var(--field);border:1px solid var(--ln);border-radius:12px;padding:13px;font-family:var(--mono);
  font-size:12px;word-break:break-all;line-height:1.6;color:var(--tx2);max-height:140px;overflow:auto;white-space:pre-wrap}

/* ── Tables / results ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:start;padding:9px 11px;border-bottom:1px solid var(--ln)}
th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
tbody tr:hover{background:var(--sunk)}
.loss-ok{color:var(--ok);font-weight:680} .loss-mid{color:var(--wr);font-weight:680} .loss-bad{color:var(--er);font-weight:680}
.progress{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s var(--spring)}
pre.logs{background:#07080b;border:1px solid var(--ln);border-radius:12px;padding:14px;max-height:460px;overflow:auto;
  font-family:var(--mono);font-size:12px;line-height:1.6;color:#cdd6e4;white-space:pre-wrap;word-break:break-word}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.stat .b{font-size:12px;color:var(--mu)} .stat .b b{display:block;font-size:20px;font-weight:720;color:var(--tx);margin-top:2px}

/* ── Login ── */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.login .box{width:100%;max-width:370px;text-align:center}
.login .mk{width:60px;height:60px;border-radius:18px;background:var(--ac);color:var(--ac-on);display:grid;place-items:center;margin:0 auto 16px}
.login .mk svg{width:30px;height:30px;stroke-width:2.2}
.login h1{font-size:25px;font-weight:720;letter-spacing:-.02em}
.login p{color:var(--mu);margin:2px 0 22px;font-size:13px}
.login .card{text-align:start}
.login .foot{display:flex;justify-content:center;gap:10px;margin-top:16px}

/* ── Toast / menus ── */
.toast{position:fixed;inset-block-end:20px;inset-inline:0;z-index:120;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast .t{background:var(--s1);border:1px solid var(--ln2);border-inline-start:3px solid var(--ac);border-radius:11px;
  padding:11px 16px;box-shadow:var(--lift);font-size:13px;font-weight:580;min-width:220px;animation:rise .25s ease}
.toast .t.ok{border-inline-start-color:var(--ok)} .toast .t.err{border-inline-start-color:var(--er)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spin{width:15px;height:15px;border:2px solid var(--ln2);border-top-color:var(--ac);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.menu{position:fixed;z-index:100;min-width:180px;padding:7px;background:var(--s1);border:1px solid var(--ln2);border-radius:14px;box-shadow:var(--lift)}
.menu h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:6px 9px 4px}
.seg{display:flex;gap:4px;padding:0 5px 7px}
.seg button{flex:1;padding:7px;border:1px solid var(--ln);border-radius:9px;background:var(--field);color:var(--mu);font-size:12px;font-weight:620;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--ac-on);border-color:transparent}
.dots{display:flex;gap:7px;padding:2px 9px 8px}
.dots button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c)}
.dots button.on{border-color:var(--tx)}
</style>
</head>
<body>
<div class="bgbars" aria-hidden="true"></div>

<div id="boot">
  <div class="boot-mark">
    <svg class="ring" viewBox="0 0 64 64"><circle class="trk" cx="32" cy="32" r="29"/><circle class="arc" cx="32" cy="32" r="29"/></svg>
  </div>
  <div class="boot-logo"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2.5"/></svg></div>
  <div class="boot-title">CandyTunnel</div>
</div>

<div id="login" class="login" hidden>
  <div class="box">
    <div class="mk"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2.5"/></svg></div>
    <h1>CandyTunnel</h1>
    <p data-i="login_sub">پنل مدیریت تونل</p>
    <div class="card">
      <label class="field"><span class="lab" data-i="password">رمز عبور</span>
        <input id="loginPw" type="password" autocomplete="current-password" autofocus></label>
      <button class="btn primary block" id="loginBtn" data-i="sign_in">ورود</button>
      <div class="foot">
        <span class="ic" id="loginLang" title="language">EN</span>
        <span class="ic" id="loginTheme" title="theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg></span>
      </div>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="hd">
    <div class="mk"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2.5"/></svg></div>
    <div class="who"><b>CandyTunnel</b><small id="hostsub">—</small></div>
    <div class="sp"></div>
    <span class="ic" id="langBtn" title="language">EN</span>

let LANG=localStorage.getItem("ct_lang")||"fa";
const T=k=>(I18N[LANG][k]||I18N.en[k]||k);
function applyLang(){
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==="fa"?"rtl":"ltr";
  document.documentElement.dataset.lang=LANG;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll("#langBtn,#loginLang").forEach(e=>e.textContent=LANG==="fa"?"EN":"فا");
  if(STATE.authed) render();
}
function applyTheme(){
  const t=localStorage.getItem("ct_theme")||"dark"; const a=localStorage.getItem("ct_accent")||"azure";
  document.documentElement.dataset.t=t; document.documentElement.dataset.accent=a;
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.content=(t==="dark"?"#070707":"#eef1f6");
}
function toast(msg,kind){const z=document.getElementById("toast");const t=document.createElement("div");
  t.className="t "+(kind||"");t.textContent=msg;z.appendChild(t);setTimeout(()=>t.remove(),3200);}
async function api(method,path,body){
  const o={method,headers:{}};
  if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  if(method!=="GET")o.headers["X-CandyTunnel"]="1";
  const r=await fetch(path,o);
  let d=null; try{d=await r.json();}catch(e){}
  if(!r.ok){throw new Error((d&&d.error)||("HTTP "+r.status));}
  return d;
}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATE={authed:false,tab:"dash",instances:[],system:null,testTimer:null};

async function boot(){
  applyTheme();
  try{const s=await api("GET","/api/session");STATE.authed=!!(s&&s.authenticated);}catch(e){}
  document.getElementById("boot").classList.add("gone");
  if(STATE.authed){showApp();}else{showLogin();}
}
function showLogin(){document.getElementById("app").hidden=true;document.getElementById("login").hidden=false;applyLang();
  setTimeout(()=>document.getElementById("loginPw").focus(),50);}
function showApp(){document.getElementById("login").hidden=true;document.getElementById("app").hidden=false;applyLang();loadSystem();render();}
async function doLogin(){const pw=document.getElementById("loginPw").value;
  try{await api("POST","/api/login",{password:pw});STATE.authed=true;showApp();}catch(e){toast(e.message,"err");}}
async function doLogout(){try{await api("POST","/api/logout",{});}catch(e){}STATE.authed=false;location.reload();}
async function loadSystem(){try{STATE.system=await api("GET","/api/system");}catch(e){}
  if(STATE.system){document.getElementById("hostsub").textContent=STATE.system.hostname+" · v"+STATE.system.binary_version;}
  if(STATE.tab==="dash")render();}

function setTab(t){STATE.tab=t;document.querySelectorAll("#dock button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  if(STATE.testTimer&&t!=="test"){clearInterval(STATE.testTimer);STATE.testTimer=null;}render();}
function render(){const v=document.getElementById("view");if(!STATE.authed)return;
  ({dash:renderDash,tun:renderTun,test:renderTest,speed:renderSpeed,logs:renderLogs}[STATE.tab]||renderDash)(v);}

function fmtUptime(s){s=s||0;const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return (d?d+"d ":"")+(h?h+"h ":"")+m+"m";}
async function renderDash(v){
  const sys=STATE.system||{cpu_cores:0,mem_total_gb:0,mem_available_gb:0,uptime_secs:0,load_avg:[0,0,0]};
  const memUsed=Math.max(0,sys.mem_total_gb-sys.mem_available_gb);
  const memPct=sys.mem_total_gb?Math.round(memUsed/sys.mem_total_gb*100):0;
  v.innerHTML=`
   <div class="card">
    <h2><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8M12 18v2"/></svg>${T("system")}</h2>
    <div class="sub">${T("sys_sub")}</div>
    <div class="res">
     <div class="t"><span class="k">${T("cores")}</span><span class="v num">${sys.cpu_cores}</span><span class="s">&nbsp;</span></div>
     <div class="t"><span class="k">${T("memory")}</span><span class="v num">${memPct}<em>%</em></span>
       <div class="bar"><i style="width:${memPct}%"></i></div><span class="s num">${memUsed.toFixed(1)} / ${sys.mem_total_gb.toFixed(1)} GB</span></div>
     <div class="t"><span class="k">${T("uptime")}</span><span class="v num" style="font-size:19px">${fmtUptime(sys.uptime_secs)}</span><span class="s">&nbsp;</span></div>
     <div class="t"><span class="k">${T("load")}</span><span class="v num">${(sys.load_avg[0]||0).toFixed(2)}</span><span class="s num">${(sys.load_avg[1]||0).toFixed(2)} · ${(sys.load_avg[2]||0).toFixed(2)}</span></div>
    </div>
   </div>
   <div class="sectitle"><h3>${T("overview")}</h3><span class="ln"></span></div>
   <div id="dashList"></div>`;
  await loadInstances();
  const list=document.getElementById("dashList");if(!list)return;
  if(!STATE.instances.length){list.innerHTML=`<div class="empty"><b>${T("no_tun")}</b>${T("no_tun_sub")}<div style="margin-top:14px"><button class="btn primary" onclick="setTab('tun')">${T("create_first")}</button></div></div>`;return;}
  list.innerHTML=STATE.instances.map(instRow).join("");
}

async function loadInstances(){try{const d=await api("GET","/api/instances");STATE.instances=d.instances||[];}catch(e){STATE.instances=[];}
  document.getElementById("dockTun").textContent=STATE.instances.length||"";}
function statusDot(i){return i.active?"on":(i.valid?"":"bad");}
function instRow(i){
  const roleTxt=i.role==="server"?T("role_server"):T("role_client");
  const st=i.active?`<span class="chip ok">${T("active")}</span>`:(i.valid?`<span class="chip">${T("inactive")}</span>`:`<span class="chip bad">${T("invalid")}</span>`);
  const proto=esc((i.uplink||"")+(i.downlink&&i.downlink!==i.uplink?"→"+i.downlink:""));
  const codeBtn=i.role==="server"?`<button class="iic" title="${T("code")}" onclick="showCode('${esc(i.name)}')"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/><path d="M9 12h6"/></svg></button>`:"";
  const toggle=i.active
    ?`<button class="iic stop" title="${T("stop")}" onclick="act('${esc(i.name)}','stop')"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>`
    :`<button class="iic go" title="${T("start")}" onclick="act('${esc(i.name)}','start')"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></button>`;
  return `<div class="inst">
    <span class="dot ${statusDot(i)}"></span>
    <div class="id"><b>${esc(i.name)}</b><div class="meta"><span class="chip role">${roleTxt}</span><span class="chip">${proto||"—"}</span>${st}</div></div>
    <div class="acts">
      ${toggle}
      <button class="iic" title="${T("restart")}" onclick="act('${esc(i.name)}','restart')"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg></button>
      <button class="iic" title="${T("spoofips")}" onclick="showSpoof('${esc(i.name)}')"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="iic" title="${T("edit")}" onclick="showEdit('${esc(i.name)}')"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
      ${codeBtn}
      <button class="iic stop" title="${T("remove")}" onclick="delInst('${esc(i.name)}')"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
    </div></div>`;
}
async function renderTun(v){
  v.innerHTML=`<div class="card"><div style="display:flex;align-items:center;gap:12px">
     <div style="flex:1"><h2><svg viewBox="0 0 24 24"><path d="M4 12h3l3-7 4 14 3-7h3"/></svg>${T("tun_list")}</h2><div class="sub" style="margin:0">${T("tun_sub")}</div></div>
     <button class="btn primary" onclick="showAdd()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>${T("new_tunnel")}</button>
    </div><div id="tunList" style="margin-top:14px"></div></div>`;
  await loadInstances();
  const list=document.getElementById("tunList");
  list.innerHTML=STATE.instances.length?STATE.instances.map(instRow).join(""):`<div class="empty"><b>${T("no_tun")}</b>${T("no_tun_sub")}</div>`;
}
async function act(name,action){try{await api("POST","/api/instances/"+encodeURIComponent(name)+"/action",{action});
  toast(name+": "+action,"ok");setTimeout(()=>render(),700);}catch(e){toast(e.message,"err");}}
async function delInst(name){if(!confirm(T("confirm_del")))return;
  try{await api("DELETE","/api/instances/"+encodeURIComponent(name));toast(T("deleted"),"ok");render();}catch(e){toast(e.message,"err");}}

function openDlg(html){document.getElementById("dlg").innerHTML=html;document.getElementById("scrim").classList.add("on");}
function closeDlg(){document.getElementById("scrim").classList.remove("on");}
document.getElementById("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeDlg();});

function showAdd(){
  openDlg(`<div class="dh"><b>${T("add_title")}</b><button class="ic x" onclick="closeDlg()">✕</button></div>
   <div class="db">
    <div class="tabs"><button id="atCode" class="on" onclick="addTab('code')">${T("tab_code")}</button><button id="atQuick" onclick="addTab('quick')">${T("tab_quick")}</button></div>
    <div id="addBody"></div>
   </div>`);
  addTab("code");
}
function addTab(which){
  document.getElementById("atCode").classList.toggle("on",which==="code");
  document.getElementById("atQuick").classList.toggle("on",which==="quick");
  const b=document.getElementById("addBody");
  if(which==="code"){
    b.innerHTML=`<div class="hint" style="margin-bottom:12px">${T("code_help")}</div>
     <label class="field"><span class="lab">${T("conn_code")}</span><textarea id="imCode" placeholder="CT1...." style="min-height:90px"></textarea></label>
     <div class="row"><label class="field"><span class="lab">${T("inst_name")}</span><input id="imName" placeholder="iran-1"></label>
      <label class="field"><span class="lab">${T("my_real")}</span><input id="imReal" placeholder="${T("auto")}"></label></div>
     <button class="btn primary block" onclick="doImport()">${T("import")}</button>`;
    prefillReal("imReal");
  }else{
    b.innerHTML=`<div class="hint" style="margin-bottom:12px">${T("quick_help")}</div>
     <div class="row">
      <label class="field"><span class="lab">${T("inst_name")}</span><input id="qName" placeholder="ger-1"></label>
      <label class="field"><span class="lab">${T("role")}</span><select id="qRole"><option value="server">${T("role_server")}</option><option value="client">${T("role_client")}</option></select></label>
     </div>
     <div class="row">
      <label class="field"><span class="lab">${T("my_real")}</span><input id="qReal" placeholder="${T("auto")}"></label>
      <label class="field"><span class="lab">${T("peer_real")}</span><input id="qPeer" placeholder="203.0.113.9"></label>
     </div>
     <div class="row">
      <label class="field"><span class="lab">${T("protocol")}</span><select id="qProto"><option value="udp">UDP</option><option value="icmp">ICMP</option><option value="tcp">TCP</option><option value="proto58">Proto58</option><option value="gre">GRE</option><option value="ipip">IPIP</option></select></label>
      <label class="field"><span class="lab">${T("data_port")}</span><input id="qPort" type="number" value="51820"></label>
     </div>
     <label class="field"><span class="lab">${T("my_spoof")}</span><textarea id="qMine" placeholder="8.8.4.4&#10;1.1.1.1"></textarea><div class="hint">${T("one_per_line")}</div></label>

const FG=[
 ["g_addr",[["role","role",["client","server"]],["real_ip"],["peer_real_ip"],["spoofed_ip"],["peer_spoofed_ip"],["spoof_rotation","bool"]]],
 ["g_trans",[["uplink_protocol","sel",["udp","icmp","proto58","tcp","quic","ipip","gre"]],["downlink_protocol","sel",["udp","icmp","proto58","tcp","quic","ipip","gre"]],["data_port","num"],["shuffle_data_port","bool"],["icmp_id","num"]]],
 ["g_mux",[["enable_multiplex","bool"],["multiplex_flush_ms","num"],["multiplex_max_payload","num"],["enable_fec","bool"],["fec_group_size","num"]]],
 ["g_sec",[["pre_shared_key"],["enable_xor","bool"],["xor_key"]]],
 ["g_dpi",[["packet_padding","bool"],["packet_padding_max","num"],["ttl_jitter","bool"],["fake_tls_header","bool"],["random_dscp","bool"]]],
 ["g_tun",[["tun_name"],["tun_ip"],["tun_peer_ip"],["tun_netmask"],["tun_mtu","num"],["mtu","num"],["interface"]]],
 ["g_perf",[["perf_mode","sel",["throughput","latency","balanced"]],["auto_tune","bool"],["tunnel_count","num"],["send_threads","num"],["send_batch","num"],["recv_batch","num"],["log_level","sel",["error","warn","info","debug","trace"]]]]
];
function fieldCtl(cfg,def){
  const key=def[0],kind=def[1]||"str",opts=def[2];let val=cfg[key];
  if(kind==="bool")return `<label class="sw full"><input type="checkbox" data-k="${key}" ${val?"checked":""}><span class="track"></span><span>${key}</span></label>`;
  const lab=`<span class="lab">${key}</span>`;
  if(kind==="sel"||kind==="role")return `<label class="field">${lab}<select data-k="${key}">${opts.map(o=>`<option ${o===val?"selected":""}>${o}</option>`).join("")}</select></label>`;
  const t=kind==="num"?"number":"text";
  if(Array.isArray(val))val=val.join(", ");
  return `<label class="field">${lab}<input type="${t}" data-k="${key}" value="${esc(val)}"></label>`;
}
async function showEdit(name){
  try{const d=await api("GET","/api/instances/"+encodeURIComponent(name));const cfg=d.config;
   const groups=FG.map(([g,fields])=>`<details class="grp"><summary>${T(g)}</summary><div class="gb">${fields.map(f=>fieldCtl(cfg,f)).join("")}</div></details>`).join("");
   openDlg(`<div class="dh"><b>${T("edit_title")} · ${esc(name)}</b><button class="ic x" onclick="closeDlg()">✕</button></div>
    <div class="db"><div id="editGroups">${groups}</div></div>
    <div class="df"><button class="btn" onclick="closeDlg()">${T("cancel")}</button><button class="btn primary" onclick="saveEdit('${esc(name)}')">${T("save")}</button></div>`);
   window._editCfg=cfg;
  }catch(e){toast(e.message,"err");}
}
async function saveEdit(name){
  const cfg=Object.assign({},window._editCfg);
  document.querySelectorAll("#editGroups [data-k]").forEach(el=>{
    const k=el.dataset.k;
    if(el.type==="checkbox")cfg[k]=el.checked;
    else if(el.type==="number")cfg[k]=parseInt(el.value)||0;
    else cfg[k]=el.value;
  });
  ["spoofed_ip_pool","peer_spoofed_ip_pool","allowed_peers","forward_ports"].forEach(k=>{
    if(typeof cfg[k]==="string")cfg[k]=splitIPs(cfg[k]).map(x=>k==="forward_ports"?(parseInt(x)||0):x).filter(x=>x!==0&&x!=="");
  });
  try{await api("POST","/api/instances",{name,config:cfg});toast(T("saved"),"ok");closeDlg();render();}catch(e){toast(e.message,"err");}
}

    <div class="row">
     <label class="field"><span class="lab">${T("mode")}</span><select id="tMode"><option value="receiver">${T("receiver")}</option><option value="sender">${T("sender")}</option></select></label>
     <label class="field"><span class="lab">${T("protocol")}</span><select id="tProto"><option value="tcp">TCP</option><option value="udp">UDP</option><option value="icmp">ICMP</option></select></label>
     <label class="field"><span class="lab">${T("port")}</span><input id="tPort" type="number" value="443"></label>

    <div style="display:flex;gap:9px"><button class="btn primary" id="tRun" onclick="testStart()">${T("run_test")}</button>
      <button class="btn" id="tStop" onclick="testStop()" disabled>${T("stop_test")}</button>

function syncTestMode(){const m=document.getElementById("tMode").value;
  document.getElementById("tTargetWrap").style.display=m==="sender"?"":"none";}
async function testStart(){
  const body={mode:document.getElementById("tMode").value,protocol:document.getElementById("tProto").value,
    ips:document.getElementById("tIps").value,target:document.getElementById("tTarget").value.trim(),
    port:parseInt(document.getElementById("tPort").value)||443,packets_per_ip:parseInt(document.getElementById("tPackets").value)||10,
    timeout_secs:parseInt(document.getElementById("tTimeout").value)||60,max_loss_pct:parseFloat(document.getElementById("tLoss").value)||20,
    rate_pps:parseInt(document.getElementById("tRate").value)||3000};
  try{await api("POST","/api/tester/start",body);document.getElementById("tResCard").hidden=false;
    document.getElementById("tRun").disabled=true;document.getElementById("tStop").disabled=false;
    if(STATE.testTimer)clearInterval(STATE.testTimer);STATE.testTimer=setInterval(testPoll,1000);testPoll();}
  catch(e){toast(e.message,"err");}
}
async function testStop(){try{await api("POST","/api/tester/stop",{});}catch(e){}}
function lossCls(p){return p<=5?"loss-ok":(p<=30?"loss-mid":"loss-bad");}
async function testPoll(){
  let d;try{d=await api("GET","/api/tester/status");}catch(e){return;}
  const s=d.state;document.getElementById("tProg").style.width=(s.progress||0)+"%";
  document.getElementById("tStatus").textContent=s.status==="running"?T("running"):T(s.status==="done"?"done":s.status);
  document.getElementById("tStat").innerHTML=
    `<div class="b">${T("sent")}<b class="num">${s.packets||0}</b></div>`+
    (s.mode==="receiver"?`<div class="b">${T("heard")}<b class="num">${s.heard_ips||0}</b></div><div class="b">${T("passed")}<b class="num" style="color:var(--ok)">${s.passed_ips||0}</b></div>`:"")+
    `<div class="b">IP<b class="num">${s.total_ips||0}</b></div>`;
  const res=d.results||[];
  if(res.length){
    const rows=res.slice(0,500).map(r=>`<tr><td class="mono">${esc(r.ip)}</td><td class="num">${r.received}/${r.expected}</td><td class="num ${lossCls(r.loss_pct)}">${r.loss_pct}%</td><td>${r.passed?T("pass"):T("fail")}</td></tr>`).join("");
    const passed=res.filter(r=>r.passed).map(r=>r.ip);
    document.getElementById("tResults").innerHTML=
      (passed.length?`<button class="btn primary sm" style="margin-bottom:10px" onclick='applyPassing(${JSON.stringify(passed)})'>${T("add_to_tun")} (${passed.length})</button>`:"")+
      `<table><thead><tr><th>${T("ip")}</th><th>${T("received")}</th><th>${T("loss")}</th><th>${T("status")}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }else if(s.status!=="running"){document.getElementById("tResults").innerHTML=`<div class="empty">${T("no_results")}</div>`;}
  if(s.status!=="running"){clearInterval(STATE.testTimer);STATE.testTimer=null;
    document.getElementById("tRun").disabled=false;document.getElementById("tStop").disabled=true;
    if(s.error)toast(s.error,"err");}
}

  if(!opts){toast(T("pick_tun"),"err");return;}

   <div class="db">

async function speedRun(){
  const body={target:document.getElementById("spTarget").value.trim(),port:parseInt(document.getElementById("spPort").value)||5201,
    duration:parseInt(document.getElementById("spDur").value)||10,udp:document.getElementById("spUdp").value==="1",
    reverse:document.getElementById("spRev").checked};
  if(!body.target){toast(T("target"),"err");return;}
  try{const d=await api("POST","/api/speedtest",body);document.getElementById("spRun").disabled=true;
    document.getElementById("spStatus").textContent=T("running");speedPoll(d.job_id);}catch(e){toast(e.message,"err");}
}
async function speedPoll(id){
  let d;try{d=await api("GET","/api/speedtest/"+id);}catch(e){document.getElementById("spRun").disabled=false;return;}
  if(d.state==="running"){setTimeout(()=>speedPoll(id),1000);return;}
  document.getElementById("spRun").disabled=false;document.getElementById("spStatus").textContent=T("done");
  if(d.state==="error"){toast(d.error||"error","err");return;}
  const up=d.mbps_sent!=null?d.mbps_sent.toFixed(1):"—",dn=d.mbps_recv!=null?d.mbps_recv.toFixed(1):"—";
  document.getElementById("spStat").innerHTML=`<div class="b">${T("upload")}<b class="num">${up} <span style="font-size:12px;color:var(--mu)">Mbit/s</span></b></div>
    <div class="b">${T("download")}<b class="num">${dn} <span style="font-size:12px;color:var(--mu)">Mbit/s</span></b></div>`;
}

function appearanceMenu(anchor){
  closeMenus();
  const m=document.createElement("div");m.className="menu";m.id="apMenu";
  const t=localStorage.getItem("ct_theme")||"dark",a=localStorage.getItem("ct_accent")||"azure";
  const accents=[["azure","#38bdf8"],["violet","#8b7cf6"],["lime","#8bd450"],["ember","#f6702d"]];
  m.innerHTML=`<h4>Theme</h4><div class="seg">
     <button data-th="dark" class="${t==="dark"?"on":""}">Dark</button><button data-th="light" class="${t==="light"?"on":""}">Light</button></div>
    <h4>Accent</h4><div class="dots">${accents.map(([k,c])=>`<button data-ac="${k}" class="${a===k?"on":""}" style="--c:${c}"></button>`).join("")}</div>`;
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();m.style.top=(r.bottom+6)+"px";
  if(LANG==="fa")m.style.left=r.left+"px";else m.style.right=(window.innerWidth-r.right)+"px";
  m.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{localStorage.setItem("ct_theme",b.dataset.th);applyTheme();appearanceMenu(anchor);});
  m.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{localStorage.setItem("ct_accent",b.dataset.ac);applyTheme();appearanceMenu(anchor);});
}
function closeMenus(){const m=document.getElementById("apMenu");if(m)m.remove();}

document.getElementById("apBtn").onclick=e=>{if(document.getElementById("apMenu"))closeMenus();else appearanceMenu(e.currentTarget);};
document.getElementById("dock").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b)setTab(b.dataset.tab);});
